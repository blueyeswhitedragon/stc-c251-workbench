name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path artifacts -Filter '*.vsix' | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $asset.FullName `
            --title "${{ github.ref_name }}" `
            --generate-notes
