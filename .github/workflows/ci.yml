name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyserial==3.5 tqdm==4.70.1 colorama==0.4.6
      - run: npm ci
      - run: npm test
      - name: Python backend tests
        run: python -m unittest discover -s test -p 'test_backend.py'
      - name: Python backend lifecycle tests
        run: python -m unittest discover -s test -p 'test_backend_lifecycle.py'
      - name: Python offline protocol tests
        run: python -m unittest discover -s test -p 'test_offline_protocol.py'
      - name: Python programming contract tests
        run: python -m unittest discover -s test -p 'test_programming_contract.py'
      - run: python -m py_compile python/backend.py python/probe_core.py

  package:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: stc-c251-workbench-vsix
          path: artifacts/*.vsix
